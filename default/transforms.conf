# =============================================================================
# transforms.conf — Lookup definitions for KV Store collections
# =============================================================================

[ioc_entries_lookup]
collection    = ioc_entries
app           = edl_manager
external_type = kvstore
fields_list   = _key, type, value, list_type, policy_names, start_time, stop_time, refresh_interval, status, created_by, created_at, last_modified_by, last_modified_at, description, tags, source, source_ref, conflict_state, conflict_resolution, hit_count, last_hit_at

[edl_policies_lookup]
collection    = edl_policies
app           = edl_manager
external_type = kvstore
fields_list   = _key, name, description, default_ttl_hours, list_type_default, refresh_behavior, auto_disable_on_expiry, created_by, created_at, last_modified_at

[edl_audit_log_lookup]
collection    = edl_audit_log
app           = edl_manager
external_type = kvstore
fields_list   = _key, timestamp, timestamp_iso, actor, action, target_type, target_key, target_value, changes, ip_address, session_id

[edl_taxii_sources_lookup]
collection    = edl_taxii_sources
app           = edl_manager
external_type = kvstore
fields_list   = _key, name, description, taxii_server_url, collection_id, api_root, username, password_encrypted, polling_interval_minutes, default_policy, default_list_type, default_ttl_hours, enabled, created_by, created_at, last_polled_at, last_poll_count, last_poll_status

[edl_taxii_runs_lookup]
collection    = edl_taxii_runs
app           = edl_manager
external_type = kvstore
fields_list   = _key, source_name, last_added, cursor, objects_fetched, errors

[edl_tokens_lookup]
collection    = edl_tokens
app           = edl_manager
external_type = kvstore
fields_list   = _key, name, token_hash, owner, capabilities, created_at, expires_at, last_used_at, active, description

[edl_conflicts_lookup]
collection    = edl_conflicts
app           = edl_manager
external_type = kvstore
fields_list   = _key, type, value, block_key, allow_key, state, resolution, resolved_by, resolved_at, detected_at

[edl_active_export]
filename = edl_active_export.csv

[edl_geo_cache_lookup]
collection    = edl_geo_cache
app           = edl_manager
external_type = kvstore
fields_list   = _key, value, type, lat, lon, country, country_code, city, region, asn, org, subnet_24, hit_count, last_hit_at, enriched_at

[edl_campaigns_lookup]
collection    = edl_campaigns
app           = edl_manager
external_type = kvstore
fields_list   = _key, cluster_key, cluster_type, cluster_label, country, country_code, asn, org, subnet_24, ioc_count, hit_count, first_seen, last_seen, threat_score, status, notes, ioc_keys, lat, lon

[edl_rate_limits_lookup]
collection    = edl_rate_limits
app           = edl_manager
external_type = kvstore
fields_list   = _key, client_key, client_type, request_count, window_start, window_end, blocked

[edl_feed_block_ip]
filename = edl_feed_block_ip.csv

[edl_feed_block_domain]
filename = edl_feed_block_domain.csv

[edl_feed_block_url]
filename = edl_feed_block_url.csv

[edl_feed_allow_ip]
filename = edl_feed_allow_ip.csv

[edl_feed_allow_domain]
filename = edl_feed_allow_domain.csv

[edl_feed_allow_url]
filename = edl_feed_allow_url.csv
