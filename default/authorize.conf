# =============================================================================
# authorize.conf — Custom capability definitions for EDL Manager
# =============================================================================

[capability::edl_read]
# Grants read access to EDL IOCs, policies, audit log, feed, and stats.
# Assign to roles that should be able to view the EDL Manager app.

[capability::edl_write]
# Grants write access to create, update, and delete IOCs and policies.
# Assign to roles with operational/admin privileges.

# Grant both capabilities to the admin role by default.
[role_admin]
edl_read  = enabled
edl_write = enabled

# Read-only for power users; adjust per your org's RBAC model.
[role_power]
edl_read = enabled
