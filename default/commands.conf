# =============================================================================
# commands.conf — Custom search command registrations
#
# CRITICAL: Both chunked=true and requires_srinfo=true are required for
# self.service to be populated in the | edl_feed generating command.
# Without them, self.service returns None and KV Store reads silently fail.
# Verified against splunk-sdk-python: splunklib/searchcommands/search_command.py
# =============================================================================

[edl_feed]
filename            = edl_feed.py
python.version      = python3
chunked             = true
requires_srinfo     = true
enableheader        = true
generating          = true
generates_timeorder = false
streaming           = false
retainsevents       = false
local               = true
