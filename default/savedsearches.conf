# =============================================================================
# savedsearches.conf — Scheduled saved searches
# =============================================================================

[EDL Active Export]
search        = | inputlookup ioc_entries_lookup \
                | where status="active" \
                | eval now=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
                | where (isnull(stop_time) OR stop_time="" OR stop_time > now) \
                | where (isnull(start_time) OR start_time="" OR start_time <= now) \
                | table type, value, list_type, policy_names, description, source \
                | outputlookup edl_active_export
cron_schedule = */5 * * * *
enableSched   = 1
dispatch.earliest_time = -5m
dispatch.latest_time   = now
description   = Materialises the active IOC list to CSV for fast firewall feed reads.

[EDL Expire IOCs]
search        = | inputlookup ioc_entries_lookup \
                | eval now=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
                | where status="active" AND stop_time < now AND stop_time != "" \
                | eval status="inactive", last_modified_at=now, last_modified_by="system:scheduled_expiry" \
                | table _key, status, last_modified_at, last_modified_by \
                | outputlookup append=f ioc_entries_lookup
cron_schedule = 0 0 * * *
enableSched   = 1
description   = Auto-disables IOC entries whose stop_time has passed.

[EDL Expiry Warning Alert]
search        = | inputlookup ioc_entries_lookup \
                | eval now=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
                | eval in48h=strftime(now()+172800, "%Y-%m-%dT%H:%M:%SZ") \
                | where status="active" AND stop_time > now AND stop_time < in48h \
                | stats count as expiring_count values(value) as sample_values \
                | where expiring_count > 0
cron_schedule = 0 */6 * * *
enableSched   = 1
alert.track   = 1
alert.severity = 3
description   = Alerts when active IOCs are expiring within 48 hours.

[EDL TAXII Poll]
search        = | rest /servicesNS/nobody/edl_manager/edl_manager/taxii splunk_server=local \
                | search action="poll_all" \
                | table name, last_poll_count, last_poll_status, last_polled_at
cron_schedule = */30 * * * *
enableSched   = 1
description   = Polls all enabled TAXII 2.1 sources for new indicators.

[EDL Conflict Detector]
search        = | inputlookup ioc_entries_lookup \
                | where status="active" \
                | stats values(list_type) as list_types values(_key) as keys by type value \
                | where mvcount(list_types) > 1 \
                | eval conflict_detected=mvjoin(list_types, "/") \
                | table type, value, conflict_detected, keys
cron_schedule = */15 * * * *
enableSched   = 1
description   = Detects IOC entries that appear on both block and allow lists.

[EDL IOC Hit Tracker]
search        = | inputlookup ioc_entries_lookup WHERE status="active" \
                | rename value as ioc_value \
                | join type=left ioc_value \
                    [search index=network sourcetype=pan:traffic action=deny earliest=-24h \
                    | stats count by dest_ip \
                    | rename dest_ip as ioc_value, count as hit_count_24h] \
                | where isnotnull(hit_count_24h) \
                | eval last_hit_at=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
                | table _key, hit_count_24h, last_hit_at
cron_schedule = 0 * * * *
enableSched   = 0
description   = Correlates firewall block logs against EDL entries. DISABLED — enable in local/savedsearches.conf after setting your firewall log sourcetype.

[EDL Stale IOC Report]
search        = | inputlookup ioc_entries_lookup \
                | eval now=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
                | eval age_days=round((now()-strptime(created_at, "%Y-%m-%dT%H:%M:%SZ"))/86400, 0) \
                | where status="active" AND (isnull(hit_count) OR hit_count=0 OR hit_count="") AND age_days > 90 \
                | table type, value, list_type, policy_names, source, created_at, age_days \
                | sort -age_days
cron_schedule = 0 8 * * 1
enableSched   = 1
description   = Weekly report of active IOCs older than 90 days with zero hits.

[EDL GeoIP Enrichment]
search        = | inputlookup ioc_entries_lookup \
                | where type="ip" AND status="active" \
                | rename value as ip \
                | iplocation ip \
                | eval value=ip \
                | eval subnet_24=replace(ip, "\.\d+$", ".0/24") \
                | eval enriched_at=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
                | eval lat=coalesce(lat, "0"), lon=coalesce(lon, "0") \
                | eval country=coalesce(Country, "Unknown"), city=coalesce(City, "") \
                | eval asn=coalesce(AS, ""), org=coalesce(Organization, "") \
                | table value, type, lat, lon, country, city, asn, org, subnet_24, hit_count, last_hit_at, enriched_at \
                | outputlookup edl_geo_cache_lookup
cron_schedule = */15 * * * *
enableSched   = 1
description   = Enriches IOC hits with GeoIP data for attack map and campaign analysis.

[EDL Campaign Detection]
search        = | inputlookup edl_geo_cache_lookup \
                | where isnotnull(lat) AND lat != "0" \
                | eval hit_count=coalesce(hit_count, 0) \
                | stats count as ioc_count sum(hit_count) as hit_count \
                    first(lat) as lat first(lon) as lon first(country) as country first(org) as org \
                    min(last_hit_at) as first_seen max(last_hit_at) as last_seen by subnet_24 \
                | where ioc_count >= 2 \
                | eval cluster_key="subnet:" . subnet_24 \
                | eval cluster_label=subnet_24 . " (" . country . ")" \
                | eval threat_score=round((ioc_count * 10) + (hit_count * 2) + if(ioc_count > 10, 30, 0), 0) \
                | eval status="open", enriched_at=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
                | table cluster_key, cluster_label, country, org, subnet_24, ioc_count, hit_count, first_seen, last_seen, threat_score, status, lat, lon \
                | outputlookup edl_campaigns_lookup
cron_schedule = 0 * * * *
enableSched   = 1
description   = Groups geo-enriched IOC hits into campaign clusters by /24 subnet.

[EDL Feed - Block IPs]
search        = | edl_feed type=ip list_type=block format=text \
                | eval value=feed | makemv delim="\n" value | mvexpand value | where value!="" \
                | table value | outputlookup edl_feed_block_ip
cron_schedule = */5 * * * *
enableSched   = 1

