# =============================================================================
# restmap.conf — Custom REST endpoint registrations
# v1.5.0 — PersistentServerConnectionApplication (PSCA)
# scripttype = persist required for PSCA
# =============================================================================

[script:edl_iocs]
match                 = /edl_manager/iocs
script                = edl_ioc_handler.py
scripttype            = persist
handler               = edl_ioc_handler.IOCHandler
requireAuthentication = true
capability.get        = edl_read
capability.post       = edl_write
capability.delete     = edl_write

[script:edl_iocs_single]
match                 = /edl_manager/iocs/*
script                = edl_ioc_handler.py
scripttype            = persist
handler               = edl_ioc_handler.IOCHandler
requireAuthentication = true
capability.get        = edl_read
capability.post       = edl_write
capability.delete     = edl_write

