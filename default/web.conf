# web.conf — EDL Manager v1.5.0
# Exposes all custom REST endpoints through SplunkWeb (port 8000).
# Without these stanzas, requests to localhost:8000/en-US/splunkd/servicesNS/
# .../edl_manager/* are rejected by SplunkWeb with 404 before reaching splunkd.
#
# Format:
#   [expose:<unique_name>]
#   pattern   = <URI registered in restmap.conf match=>
#   methods   = <comma-separated HTTP verbs>

[expose:edl_iocs]
pattern  = edl_manager/iocs
methods  = GET, POST, DELETE

[expose:edl_iocs_single]
pattern  = edl_manager/iocs/*
methods  = GET, POST, DELETE

[expose:edl_policies]
pattern  = edl_manager/policies
methods  = GET, POST, DELETE

[expose:edl_policies_single]
pattern  = edl_manager/policies/*
methods  = GET, POST, DELETE

[expose:edl_feed]
pattern  = edl_manager/feed
methods  = GET

[expose:edl_import]
pattern  = edl_manager/import
methods  = POST

[expose:edl_ingest]
pattern  = edl_manager/ingest
methods  = POST

[expose:edl_export]
pattern  = edl_manager/export
methods  = GET

[expose:edl_audit]
pattern  = edl_manager/audit
methods  = GET

[expose:edl_stats]
pattern  = edl_manager/stats
methods  = GET

[expose:edl_tokens]
pattern  = edl_manager/tokens
methods  = GET, POST, DELETE

[expose:edl_tokens_single]
pattern  = edl_manager/tokens/*
methods  = GET, POST, DELETE

[expose:edl_taxii]
pattern  = edl_manager/taxii
methods  = GET, POST, DELETE

[expose:edl_taxii_single]
pattern  = edl_manager/taxii/*
methods  = GET, POST, DELETE

[expose:edl_conflicts]
pattern  = edl_manager/conflicts
methods  = GET, POST

[expose:edl_conflicts_single]
pattern  = edl_manager/conflicts/*
methods  = GET, POST

[expose:edl_hits]
pattern  = edl_manager/hits
methods  = POST

[expose:edl_geo]
pattern  = edl_manager/geo
methods  = GET

[expose:edl_campaigns]
pattern  = edl_manager/campaigns
methods  = GET
