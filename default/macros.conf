# =============================================================================
# macros.conf — SPL search macros for EDL Manager
#
# SPLUNK CLOUD COMPATIBLE — all macros use inputlookup / outputlookup only.
# No custom REST handlers, no | rest calls, no Python required.
# =============================================================================

[edl_add_iocs]
definition = eval _key=md5(type."|".value."|".list_type) \
| eval status=if(isnull(status) OR status="", "active", status) \
| eval source=if(isnull(source) OR source="", "spl-macro", source) \
| eval source_ref=if(isnull(source_ref), "", source_ref) \
| eval description=if(isnull(description), "", description) \
| eval start_time=if(isnull(start_time), "", start_time) \
| eval stop_time=if(isnull(stop_time), "", stop_time) \
| eval tags=if(isnull(tags), "", tags) \
| eval conflict_state="none" \
| eval hit_count=0 \
| eval last_hit_at="" \
| eval created_at=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
| eval last_modified_at=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
| eval last_modified_by=source \
| eval created_by=source \
| fields _key, type, value, list_type, policy_names, status, description, \
         source, source_ref, start_time, stop_time, tags, \
         conflict_state, hit_count, last_hit_at, \
         created_at, created_by, last_modified_at, last_modified_by \
| outputlookup append=t ioc_entries_lookup \
| stats count as edl_imported
iseval = 0

[edl_preview_iocs]
definition = eval _key=md5(type."|".value."|".list_type) \
| eval status=if(isnull(status) OR status="", "active", status) \
| eval source=if(isnull(source) OR source="", "spl-macro:preview", source) \
| eval description=if(isnull(description), "", description) \
| eval stop_time=if(isnull(stop_time), "", stop_time) \
| eval _edl_valid=case( \
    NOT match(type, "^(ip|url|domain)$"),       "ERROR: type must be ip|url|domain", \
    isnull(value) OR value="",                   "ERROR: value is required", \
    NOT match(list_type, "^(block|allow)$"),     "ERROR: list_type must be block|allow", \
    isnull(policy_names) OR policy_names="",     "ERROR: policy_names is required", \
    1=1,                                         "valid" \
) \
| rename _edl_valid as edl_status \
| table type, value, list_type, policy_names, edl_status, description, start_time, stop_time, source
iseval = 0

[edl_block_iocs]
definition = eval list_type="block" \
| eval policy_names=if(isnull(policy_names) OR policy_names="", "default", policy_names) \
| `edl_add_iocs`
iseval = 0

[edl_allow_iocs]
definition = eval list_type="allow" \
| eval policy_names=if(isnull(policy_names) OR policy_names="", "default", policy_names) \
| `edl_add_iocs`
iseval = 0

[edl_iocs(3)]
args      = policy, type, list_type
definition = inputlookup ioc_entries_lookup \
| where status="active" \
    AND list_type="$list_type$" \
    AND type="$type$" \
    AND (policy_names="$policy$" OR like(policy_names, "%$policy$%")) \
| eval _edl_now=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
| where (isnull(stop_time)  OR stop_time=""  OR stop_time  > _edl_now) \
| where (isnull(start_time) OR start_time="" OR start_time <= _edl_now) \
| table value, type, list_type, policy_names, description, stop_time, source
iseval = 0

[edl_expire_iocs(1)]
args      = hours
definition = eval _delta=$hours$*3600 \
| eval stop_time=if(isnull(stop_time) OR stop_time="", \
    strftime(now()+_delta, "%Y-%m-%dT%H:%M:%SZ"), \
    strftime(strptime(stop_time, "%Y-%m-%dT%H:%M:%SZ")+_delta, "%Y-%m-%dT%H:%M:%SZ") \
) \
| eval status="active" \
| eval last_modified_at=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
| eval last_modified_by="spl-macro:expire" \
| fields _key, stop_time, status, last_modified_at, last_modified_by \
| outputlookup append=t ioc_entries_lookup \
| stats count as edl_extended
iseval = 0

[edl_disable_iocs]
definition = eval status="inactive" \
| eval last_modified_at=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
| eval last_modified_by="spl-macro:disable" \
| fields _key, status, last_modified_at, last_modified_by \
| outputlookup append=t ioc_entries_lookup \
| stats count as edl_disabled
iseval = 0

[edl_active_count]
definition = inputlookup ioc_entries_lookup \
| eval _now=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
| where status="active" \
    AND (isnull(stop_time)  OR stop_time=""  OR stop_time  > _now) \
    AND (isnull(start_time) OR start_time="" OR start_time <= _now) \
| stats count as edl_active, dc(type) as edl_types, dc(policy_names) as edl_policies
iseval = 0

[edl_expiring(1)]
args      = hours
definition = inputlookup ioc_entries_lookup \
| eval _now=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
| eval _cutoff=strftime(now()+($hours$*3600), "%Y-%m-%dT%H:%M:%SZ") \
| where status="active" AND stop_time > _now AND stop_time <= _cutoff \
| table value, type, list_type, policy_names, stop_time, source, description \
| sort stop_time
iseval = 0

[edl_hits_update]
definition = eval last_hit_at=if(isnull(last_seen), \
    strftime(now(), "%Y-%m-%dT%H:%M:%SZ"), last_seen) \
| eval last_modified_at=strftime(now(), "%Y-%m-%dT%H:%M:%SZ") \
| fields _key, hit_count, last_hit_at, last_modified_at \
| outputlookup append=t ioc_entries_lookup \
| stats count as edl_hits_updated
iseval = 0
