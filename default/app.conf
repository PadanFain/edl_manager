[launcher]
author=Security Engineering
description=External Dynamic List (EDL) Manager — works on Splunk Cloud (KV Store + SPL macros) and Splunk Enterprise (full REST handlers + Python backend).
version=1.5.0

[package]
id=edl_manager

[ui]
is_visible=1
label=EDL Manager

[app]
build=1

[deploy]
# Set to 1 if deploying to Splunk Cloud (disables Python REST handler registration)
# Set to 0 for Splunk Enterprise (enables full Python REST handler backend)
cloud_mode=0
